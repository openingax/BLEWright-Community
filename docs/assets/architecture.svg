<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">BLEWright architecture / 架构</title><desc id="desc">An iOS CoreBluetooth runtime adapter and an Android Frida hook plus host relay connect to a local Mac RPC service. Sessions use a mock peripheral or a USB-connected ESP32-S3 communicating with a real BLE peripheral.</desc>
